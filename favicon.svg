<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Dark Squircle Background -->
  <rect width="64" height="64" rx="15" fill="#181a20"/>

  <!-- Inner Elevated Dark Panel -->
  <rect x="6" y="6" width="52" height="52" rx="12" fill="#22252e" stroke="#2e333d" stroke-width="1"/>

  <!-- Neon Green Scanner Group with Glow Effect -->
  <g filter="url(#neon-glow)" stroke="#A3E635" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Corner -->
    <path d="M 18 24 V 19 A 3 3 0 0 1 21 16 H 26" fill="none" stroke-width="2.5"/>
    <!-- Top-Right Corner -->
    <path d="M 38 16 H 43 A 3 3 0 0 1 46 19 V 24" fill="none" stroke-width="2.5"/>
    <!-- Bottom-Left Corner -->
    <path d="M 18 40 V 45 A 3 3 0 0 0 21 48 H 26" fill="none" stroke-width="2.5"/>
    <!-- Bottom-Right Corner -->
    <path d="M 38 48 H 43 A 3 3 0 0 0 46 45 V 40" fill="none" stroke-width="2.5"/>

    <!-- Barcode Lines inside frame -->
    <line x1="22" y1="22" x2="22" y2="42" stroke-width="2"/>
    <line x1="26" y1="22" x2="26" y2="42" stroke-width="1.2"/>
    <line x1="29" y1="22" x2="29" y2="42" stroke-width="2.2"/>
    <line x1="32" y1="22" x2="32" y2="42" stroke-width="1"/>
    <line x1="35" y1="22" x2="35" y2="42" stroke-width="2.5"/>
    <line x1="38" y1="22" x2="38" y2="42" stroke-width="1.2"/>
    <line x1="42" y1="22" x2="42" y2="42" stroke-width="2"/>

    <!-- Center Scan Laser Line -->
    <line x1="16" y1="32" x2="48" y2="32" stroke="#BEF264" stroke-width="2.5"/>
  </g>
</svg>
